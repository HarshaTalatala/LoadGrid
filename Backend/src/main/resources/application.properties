spring.application.name=TransportManagementSystem
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transport_management_system}
spring.datasource.username=${DB_USERNAME:tms_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://loadgrid.vercel.app,https://*.vercel.app,https://loadgrid.harshabuilds.tech}
